<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" id="git-icon">
  <defs>
    <style>
      @keyframes git-branch-anim {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 40; }
      }
      @keyframes git-pulse-dot {
        0%, 100% { r: 5.5; opacity: 1; filter: drop-shadow(0 0 2px #F03C2E); }
        50% { r: 7; opacity: 0.85; filter: drop-shadow(0 0 6px #F03C2E); }
      }
      @keyframes git-box-glow {
        0%, 100% { stroke: #30363d; }
        50% { stroke: #F03C2E; }
      }
      .git-bg {
        animation: git-box-glow 4s ease-in-out infinite;
      }
      .git-line {
        stroke: #F03C2E;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 40;
        animation: git-branch-anim 3s ease-in-out infinite alternate;
      }
      .git-dot-1 {
        fill: #F03C2E;
        animation: git-pulse-dot 2s ease-in-out infinite;
      }
      .git-dot-2 {
        fill: #F03C2E;
        animation: git-pulse-dot 2s ease-in-out infinite 0.6s;
      }
      .git-dot-3 {
        fill: #F03C2E;
        animation: git-pulse-dot 2s ease-in-out infinite 1.2s;
      }
    </style>
  </defs>
  <rect class="git-bg" x="6" y="6" width="88" height="88" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g transform="translate(14, 14) scale(0.72)">
    <!-- Git Branch Diagram -->
    <!-- Main stem -->
    <line x1="30" y1="20" x2="30" y2="80" class="git-line" />
    <!-- Branch curve -->
    <path d="M 30 50 Q 50 50 65 35" fill="none" class="git-line" />
    <line x1="65" y1="35" x2="65" y2="20" class="git-line" />
    <!-- Commit Nodes -->
    <circle cx="30" cy="20" r="6" class="git-dot-1" />
    <circle cx="30" cy="80" r="6" class="git-dot-2" />
    <circle cx="65" cy="20" r="6" class="git-dot-3" />
  </g>
</svg>
