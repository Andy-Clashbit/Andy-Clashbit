<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Soft atmospheric glow -->
    <filter id="horizonGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base static gradient fading out smoothly to both ends -->
    <linearGradient id="horizonBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0" />
      <stop offset="15%" stop-color="#312e81" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#6d28d9" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#6d28d9" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#312e81" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </linearGradient>

    <!-- Dynamic traveling light beam gradient -->
    <linearGradient id="shimmerBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes horizon-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes shimmer-slide {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1200px); }
    }
    .base-glow {
      animation: horizon-pulse 4s ease-in-out infinite;
    }
    .shimmer-light {
      animation: shimmer-slide 4.5s ease-in-out infinite;
    }
  </style>

  <!-- Base soft ambient aura -->
  <line class="base-glow" x1="60" y1="12" x2="1140" y2="12" stroke="url(#horizonBase)" stroke-width="4" filter="url(#horizonGlow)" opacity="0.4" />

  <!-- Crisp hairline -->
  <line x1="20" y1="12" x2="1180" y2="12" stroke="url(#horizonBase)" stroke-width="1.5" />

  <!-- Subtle smooth traveling light particle/shimmer -->
  <rect class="shimmer-light" y="10" width="300" height="4" rx="2" fill="url(#shimmerBeam)" opacity="0.85" filter="url(#horizonGlow)" />
</svg>
