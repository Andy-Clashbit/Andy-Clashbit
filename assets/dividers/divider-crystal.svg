<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="36" fill="none">
  <defs>
    <!-- Soft neon blur -->
    <filter id="crystalGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Full-width cyberpunk gradient: reaches 0% and 100% edges -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.65" />
      <stop offset="8%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="28%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="92%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.65" />
    </linearGradient>

    <!-- Core crystal fill -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes crystal-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
    @keyframes brackets-shift {
      0%, 100% {
        transform: translateX(0);
        opacity: 0.75;
      }
      50% {
        transform: translateX(1.5px);
        opacity: 1;
      }
    }
    @keyframes brackets-shift-left {
      0%, 100% {
        transform: translateX(0);
        opacity: 0.75;
      }
      50% {
        transform: translateX(-1.5px);
        opacity: 1;
      }
    }
    .crystal-core {
      transform-origin: 600px 18px;
      animation: crystal-pulse 3s ease-in-out infinite;
    }
    .bracket-left {
      transform-origin: 562px 18px;
      animation: brackets-shift-left 3s ease-in-out infinite;
    }
    .bracket-right {
      transform-origin: 638px 18px;
      animation: brackets-shift 3s ease-in-out infinite;
    }
  </style>

  <!-- Ambient background glow beam spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#crystalGrad)" stroke-width="4.5" opacity="0.4" filter="url(#crystalGlow)" />

  <!-- Crisp laser baseline spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#crystalGrad)" stroke-width="1.8" />

  <!-- Outer edge accent nodes -->
  <circle cx="16" cy="18" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="36" cy="18" r="1.5" fill="#7c3aed" opacity="0.6" />
  <circle cx="1164" cy="18" r="1.5" fill="#7c3aed" opacity="0.6" />
  <circle cx="1184" cy="18" r="2" fill="#38bdf8" opacity="0.8" />

  <!-- Intermediate tech node dots -->
  <circle cx="490" cy="18" r="1.5" fill="#312e81" opacity="0.6" />
  <circle cx="515" cy="18" r="2" fill="#6d28d9" opacity="0.75" />
  <circle cx="538" cy="18" r="2.5" fill="#06b6d4" opacity="0.9" />

  <circle cx="662" cy="18" r="2.5" fill="#06b6d4" opacity="0.9" />
  <circle cx="685" cy="18" r="2" fill="#6d28d9" opacity="0.75" />
  <circle cx="710" cy="18" r="1.5" fill="#312e81" opacity="0.6" />

  <!-- Tech brackets < > -->
  <path class="bracket-left" d="M 567 12 L 559 18 L 567 24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path class="bracket-right" d="M 633 12 L 641 18 L 633 24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing central diamond crystal -->
  <g class="crystal-core" filter="url(#crystalGlow)">
    <rect x="592" y="10" width="16" height="16" rx="2" fill="url(#gemGrad)" transform="rotate(45 600 18)" />
    <rect x="596" y="14" width="8" height="8" rx="1" fill="#ffffff" transform="rotate(45 600 18)" opacity="0.95" />
  </g>
</svg>
