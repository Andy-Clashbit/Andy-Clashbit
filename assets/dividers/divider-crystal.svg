<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="36" fill="none">
  <defs>
    <!-- Soft neon blur -->
    <filter id="crystalGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow laser glow -->
    <filter id="arrowGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Full-width cyberpunk gradient: reaches 0% and 100% edges -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.65" />
      <stop offset="8%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="28%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="92%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.65" />
    </linearGradient>

    <!-- Core crystal fill -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes crystal-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
    @keyframes center-bracket-pulse {
      0%, 100% {
        opacity: 0.35;
      }
      50% {
        opacity: 0.65;
      }
    }
    @keyframes arrow-fly-left {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      75% {
        opacity: 0.8;
      }
      100% {
        transform: translateX(-550px);
        opacity: 0;
      }
    }
    @keyframes arrow-fly-right {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      75% {
        opacity: 0.8;
      }
      100% {
        transform: translateX(550px);
        opacity: 0;
      }
    }
    .crystal-core {
      transform-origin: 600px 18px;
      animation: crystal-pulse 3s ease-in-out infinite;
    }
    .center-bracket {
      animation: center-bracket-pulse 3s ease-in-out infinite;
    }
    .arrow-fly-left {
      animation: arrow-fly-left 4.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .arrow-fly-right {
      animation: arrow-fly-right 4.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .wave-2 {
      animation-delay: -2.2s;
    }
  </style>

  <!-- Ambient background glow beam spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#crystalGrad)" stroke-width="4.5" opacity="0.4" filter="url(#crystalGlow)" />

  <!-- Crisp laser baseline spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#crystalGrad)" stroke-width="1.8" />

  <!-- Outer edge accent nodes -->
  <circle cx="16" cy="18" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="36" cy="18" r="1.5" fill="#7c3aed" opacity="0.6" />
  <circle cx="1164" cy="18" r="1.5" fill="#7c3aed" opacity="0.6" />
  <circle cx="1184" cy="18" r="2" fill="#38bdf8" opacity="0.8" />

  <!-- Intermediate tech node dots -->
  <circle cx="490" cy="18" r="1.5" fill="#312e81" opacity="0.6" />
  <circle cx="515" cy="18" r="2" fill="#6d28d9" opacity="0.75" />
  <circle cx="538" cy="18" r="2.5" fill="#06b6d4" opacity="0.9" />

  <circle cx="662" cy="18" r="2.5" fill="#06b6d4" opacity="0.9" />
  <circle cx="685" cy="18" r="2" fill="#6d28d9" opacity="0.75" />
  <circle cx="710" cy="18" r="1.5" fill="#312e81" opacity="0.6" />

  <!-- Ambient center brackets maintaining visual structure < > -->
  <path class="center-bracket" d="M 567 12 L 559 18 L 567 24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path class="center-bracket" d="M 633 12 L 641 18 L 633 24" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flying arrows group: Wave 1 (smooth outward flight) -->
  <g filter="url(#arrowGlow)">
    <path class="arrow-fly-left" d="M 567 12 L 559 18 L 567 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path class="arrow-fly-right" d="M 633 12 L 641 18 L 633 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Flying arrows group: Wave 2 (smooth offset flight) -->
  <g filter="url(#arrowGlow)">
    <path class="arrow-fly-left wave-2" d="M 567 12 L 559 18 L 567 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path class="arrow-fly-right wave-2" d="M 633 12 L 641 18 L 633 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing central diamond crystal -->
  <g class="crystal-core" filter="url(#crystalGlow)">
    <rect x="592" y="10" width="16" height="16" rx="2" fill="url(#gemGrad)" transform="rotate(45 600 18)" />
    <rect x="596" y="14" width="8" height="8" rx="1" fill="#ffffff" transform="rotate(45 600 18)" opacity="0.95" />
  </g>
</svg>
