<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="36" fill="none">
  <defs>
    <!-- Soft glow filter -->
    <filter id="codeGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Full-width gradient spanning 0% to 100% -->
    <linearGradient id="codeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="8%" stop-color="#312e81" stop-opacity="0.75" />
      <stop offset="28%" stop-color="#6d28d9" stop-opacity="0.9" />
      <stop offset="46%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="54%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#6d28d9" stop-opacity="0.9" />
      <stop offset="92%" stop-color="#312e81" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Chip border gradient -->
    <linearGradient id="chipBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes chip-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.65)); }
    }
    .term-cursor {
      animation: cursor-blink 1.2s infinite;
    }
    .dev-chip {
      animation: chip-glow 4s ease-in-out infinite;
    }
  </style>

  <!-- Ambient glow beam spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#codeLineGrad)" stroke-width="4.5" opacity="0.35" filter="url(#codeGlow)" />

  <!-- Laser baseline spanning full width 0 -> 1200 -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#codeLineGrad)" stroke-width="1.8" />

  <!-- Outer edge terminal data nodes -->
  <rect x="12" y="15" width="6" height="6" fill="#06b6d4" rx="1" opacity="0.8" />
  <line x1="24" y1="18" x2="64" y2="18" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.7" />

  <line x1="1136" y1="18" x2="1176" y2="18" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" opacity="0.7" />
  <rect x="1182" y="15" width="6" height="6" fill="#06b6d4" rx="1" opacity="0.8" />

  <!-- Segmented data bus dashes near center -->
  <line x1="430" y1="18" x2="540" y2="18" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.85" />
  <line x1="660" y1="18" x2="770" y2="18" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.85" />

  <!-- Dev Terminal Chip in Center -->
  <g class="dev-chip" transform="translate(560, 6)">
    <!-- Pill background -->
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#09090f" stroke="url(#chipBorderGrad)" stroke-width="1.5" />

    <!-- Code glyph </_> -->
    <text x="35" y="16.5" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">&lt;/&gt;</text>
    <rect class="term-cursor" x="55" y="7" width="2" height="10" fill="#22c55e" rx="1" />
  </g>
</svg>
