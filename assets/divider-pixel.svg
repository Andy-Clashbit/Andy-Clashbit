<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="20" viewBox="0 0 1200 20" shape-rendering="crispEdges">
  <defs>
    <pattern id="pixelTrack" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="8" width="8" height="4" fill="#30363d"/>
    </pattern>
  </defs>
  <!-- Dotted pixel track across full width -->
  <rect x="0" y="0" width="1200" height="20" fill="url(#pixelTrack)"/>
  <!-- Animated pixel pulse moving across -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-60 0" to="1260 0" dur="3s" repeatCount="indefinite"/>
    <!-- Trailing pixel sparks -->
    <rect x="0" y="8" width="8" height="4" fill="#58a6ff" opacity="0.4"/>
    <rect x="12" y="8" width="8" height="4" fill="#58a6ff" opacity="0.7"/>
    <rect x="24" y="6" width="10" height="8" fill="#79c0ff"/>
    <!-- Head pixel bit -->
    <rect x="38" y="4" width="14" height="12" fill="#58a6ff"/>
    <rect x="42" y="7" width="6" height="6" fill="#ffffff"/>
  </g>
</svg>
